name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Test
        shell: pwsh
        run: |
          . .\scripts\env.ps1
          uv python install 3.11
          uv sync --extra dev --locked --no-editable
          uv run --no-sync ruff check .
          uv run --no-sync pytest --cov=voice_subtitle_translator

  build-portable:
    runs-on: windows-2022
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Build onedir ZIP
        shell: pwsh
        run: .\scripts\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-development-build
          path: artifacts/*
