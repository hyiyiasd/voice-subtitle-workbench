name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
body:
  - type: textarea
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    attributes:
      label: 版本与 SHA-256
    validations:
      required: true
  - type: textarea
    attributes:
      label: 环境
      description: Windows 版本、CPU、GPU、驱动和所用模型。请勿粘贴 API Key 或私人字幕。

